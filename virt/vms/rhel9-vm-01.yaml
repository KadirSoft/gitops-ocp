apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: rhel9-vm-01
  namespace: vms
  labels:
    app: rhel9-vm-01
spec:
  running: true
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.medium
  preference:
    kind: VirtualMachineClusterPreference
    name: rhel.9
  dataVolumeTemplates:
    - metadata:
        name: rhel9-vm-01-rootdisk
      spec:
        storage:
          storageClassName: ocs-storagecluster-ceph-rbd-virtualization
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 30Gi
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
  template:
    metadata:
      labels:
        kubevirt.io/domain: rhel9-vm-01
    spec:
      evictionStrategy: LiveMigrate
      terminationGracePeriodSeconds: 180
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: rhel9-vm-01-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: cloud-user
              password: redhat123
              chpasswd:
                expire: false
      domain:
        devices:
          disks:
            - name: rootdisk
              disk: {}
              bootOrder: 1
            - name: cloudinitdisk
              disk: {}
          interfaces:
            - name: default
              masquerade: {}
